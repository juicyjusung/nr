version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # This tag is the repository's MSRV contract, not an action release.
      - dependency-name: "dtolnay/rust-toolchain"
