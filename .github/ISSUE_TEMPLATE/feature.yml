name: Feature request
description: Suggest an improvement to nr
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Explain the problem before proposing an implementation so alternatives can be compared.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today, and who is affected?
      placeholder: When I ..., I cannot ... because ...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed behavior
      description: Describe the user-visible behavior you would like, including relevant keyboard or CLI interactions.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other designs have you tried or considered?
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Note any effects on package managers, monorepos, operating systems, configuration, or stored data.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add examples, mockups, or links that clarify the request. Remove private data first.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and did not find the same request.
          required: true
        - label: I described the problem independently of a specific implementation.
          required: true
