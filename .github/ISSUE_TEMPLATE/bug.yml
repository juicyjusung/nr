name: Bug report
description: Report reproducible behavior that is incorrect or unexpected
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Search existing issues first and remove secrets or private package data from everything you submit.

        Security vulnerabilities must be reported through [GitHub private vulnerability reporting](https://github.com/juicyjusung/nr/security/advisories/new), not this form.

  - type: input
    id: version
    attributes:
      label: nr version
      description: Run `nr --version` and paste the output.
      placeholder: nr 0.2.3
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment details
      description: Include the OS version, terminal, package manager and its version, and installation method.
      placeholder: macOS 15, Terminal.app, pnpm 10, Homebrew
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest project or workspace layout and exact sequence that reproduces the issue.
      placeholder: |
        1. Create a package.json containing ...
        2. Run nr from ...
        3. Press ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste relevant errors or logs after removing secrets and private data.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, related issues, or other details that may help.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets, environment-variable values, and private package contents.
          required: true
        - label: This is not a security vulnerability.
          required: true
